<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honzův Market</title>
    <link rel="stylesheet" href="honzuv-market-v4.css">
    <meta name="honzuv-market-build" content="2026-08-11.4">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#" aria-label="Honzův Market">
            <span class="brand-mark">HM</span>
            <span>
                <strong>Honzův Market</strong>
                <small>Potraviny za férové ceny</small>
            </span>
        </a>

        <button class="cart-button" type="button" onclick="zobrazKosik()" aria-label="Otevřít košík">
            Košík <span id="pocetKosik">0</span> · <strong id="kosikHodnota">0,00 Kč</strong>
        </button>
    </header>

    <main>
        <section id="favoritesHeroSection" class="favorites-hero" aria-label="Oblíbené produkty">
            <button id="favoritesHero" class="favorites-hero-card" type="button" aria-label="Otevřít oblíbené produkty">
                <span class="favorites-hero-icon" aria-hidden="true">♥</span>
                <span class="favorites-hero-copy">
                    <strong>Oblíbené produkty</strong>
                    <small>Vaše uložené produkty na jednom místě</small>
                </span>
                <span id="favoritesCount" class="favorites-count">0</span>
                <span class="favorites-hero-arrow" aria-hidden="true">›</span>
            </button>
            <div id="favoritesActions" class="favorites-actions" hidden>
                <button id="addAllFavorites" class="favorites-add-all" type="button">Přidat všechna oblíbená do košíku</button>
            </div>
        </section>

        <section class="toolbar" aria-label="Filtry produktů">
            <div class="filters" role="group" aria-label="Kategorie">
                <button class="filter active" type="button" data-kategorie="Vše">Vše</button>
                <button class="filter" type="button" data-kategorie="Akční nabídka">Akční nabídka</button>
                <button class="filter" type="button" data-kategorie="Nejprodávanější">Nejprodávanější</button>
                <button class="filter" type="button" data-kategorie="Stálá nabídka">Stálá nabídka</button>
            </div>

            <label class="search">
                <span>Hledat</span>
                <input type="search" id="hledat" placeholder="Název nebo ID produktu">
            </label>
        </section>

        <div class="catalog-layout">
            <aside class="category-sidebar" aria-label="Skupiny produktů">
                <h2>Skupiny produktů</h2>
                <nav id="seznamKategorii" class="category-list"></nav>
            </aside>
            <section id="obsah" class="products" aria-live="polite"></section>
        </div>
    </main>

    <div id="prekryvKosiku" class="cart-overlay" onclick="zavriKosik()" hidden></div>

    <aside id="oknoKosiku" class="cart-modal" aria-labelledby="cartTitle" aria-modal="true" role="dialog" hidden>
        <div class="cart-head">
            <h2 id="cartTitle">Můj košík</h2>
            <button class="icon-button" type="button" onclick="zavriKosik()" aria-label="Zavřít košík">×</button>
        </div>

        <div id="obsahKosiku" class="cart-content"></div>

        <div class="cart-actions">
            <button class="primary" type="button" onclick="odeslatWhatsApp()">Objednat přes WhatsApp</button>
            <button class="secondary" type="button" onclick="vyprazdniKosik()">Vyprázdnit košík</button>
        </div>
    </aside>

    <script src="katalog.js"></script>
    <script src="ceny.js"></script>
    <script src="nastaveni.js"></script>
    <script src="honzuv-market-v3.js"></script>
</body>
</html>
